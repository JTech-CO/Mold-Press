name: Verify Mold Press
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/check_syntax.py
      - run: python tests/kernel_contract.py
      - run: python tests/static_site.py
      - run: python tests/browser_workflow.py
      - run: python tests/storage_tests.py
      - run: python tests/press_selection_edges.py
      - run: python tests/release_smoke.py
      - run: python tests/release_smoke.py
        env:
          MP_RENDERER: canvas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: tests/output/
